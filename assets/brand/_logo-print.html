<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vexel Media — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @page { size: 297mm 210mm; margin: 0; }   /* A4 landscape */
  html, body { margin: 0; padding: 0; background:#0a0907; color:#f4f0e1; }
  body {
    width: 297mm; height: 210mm;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bricolage Grotesque', sans-serif;
    position: relative; overflow: hidden;
    -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
  }
  .glow {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 320mm; height: 320mm; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(212,255,62,.14) 0%, rgba(212,255,62,0) 70%);
    pointer-events: none;
  }
  .glow--alt {
    background: radial-gradient(closest-side, rgba(255,107,61,.08) 0%, rgba(255,107,61,0) 70%);
    width: 220mm; height: 220mm;
  }
  .stage {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .mark {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 500;
    font-size: 64mm;
    line-height: .9;
    letter-spacing: -2.4mm;
    color: #f4f0e1;
    margin: 0;
    white-space: nowrap;
  }
  .mark i { font-style: italic; color: #d4ff3e; }
  .rule {
    display: block;
    width: 60mm; height: 1px;
    background: #d4ff3e;
    margin: 10mm 0 8mm;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 4.2mm;
    color: #8a857a;
    letter-spacing: 1.2mm;
    text-transform: uppercase;
  }
  .corners {
    position: absolute; left: 0; right: 0; bottom: 12mm;
    display: flex; justify-content: space-between;
    padding: 0 14mm;
    font-family: 'JetBrains Mono', monospace;
    font-size: 3mm;
    color: #8a857a;
    letter-spacing: 0.6mm;
    text-transform: uppercase;
    z-index: 2;
  }
  .corners i { color: #f4f0e1; font-style: normal; margin-right: 2mm; }
  .top {
    position: absolute; left: 0; right: 0; top: 12mm;
    display: flex; justify-content: space-between;
    padding: 0 14mm;
    font-family: 'JetBrains Mono', monospace;
    font-size: 3mm;
    color: #8a857a;
    letter-spacing: 0.6mm;
    text-transform: uppercase;
    z-index: 2;
  }
  .top span { display: inline-flex; align-items: center; gap: 2mm; }
  .top em { font-style: normal; color: #d4ff3e; }
  .grain {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(244,240,225,.02) 1px, transparent 1px);
    background-size: 2mm 2mm;
    opacity: .6;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow glow--alt"></div>
  <div class="grain"></div>

  <div class="top">
    <span><em>/</em> Vexel Media Wordmark</span>
    <span>v1.0 · 2026</span>
  </div>

  <div class="stage">
    <h1 class="mark">vexel<i>.media</i></h1>
    <span class="rule"></span>
    <p class="tag">Design-first growth for modern brands</p>
  </div>

  <div class="corners">
    <span><i>/Studio</i>Vexel Media</span>
    <span><i>/Based</i>Bengaluru, IN</span>
    <span><i>/Est.</i>2024</span>
  </div>
</body>
</html>
